# Only one job. Kafka is the single thing here that has no queryable database
# behind it, so it is the only thing that needs scraping.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
