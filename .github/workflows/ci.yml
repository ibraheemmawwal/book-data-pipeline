name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push should not keep burning runners, but never cancel a run on
# main: that is the one whose result the badge reports.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Settings reads the environment directly and rejects unknown PIPELINE_*
  # variables, so these are the real values the suite runs against.
  PIPELINE_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/catalogue
  PIPELINE_OPENLIBRARY_CONTACT_EMAIL: ci@example.com
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Per job: four parallel jobs sharing one key race to reserve it and
          # the losers emit a save warning on every run.
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-groups --no-group airflow
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # src/ only: dags/ is excluded deliberately and covered by the dag job.
      - run: uv run mypy src/

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Per job: four parallel jobs sharing one key race to reserve it and
          # the losers emit a save warning on every run.
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-groups --no-group airflow
      # --cov-fail-under=0 overrides the project's fail_under for this job.
      # One job cannot fairly judge coverage of code another job exercises:
      # unit tests alone score 90%, integration alone 54%. The coverage job
      # combines them and decides.
      - name: Run unit tests
        run: uv run pytest -m "not integration" --cov=src --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.unit
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: .coverage.unit
          # .coverage.* is a dotfile. Without this it is skipped silently and
          # surfaces later as a coverage drop with no failing test.
          include-hidden-files: true
          retention-days: 1

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Per job: four parallel jobs sharing one key race to reserve it and
          # the losers emit a save warning on every run.
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-groups --no-group airflow
      # testcontainers starts its own PostgreSQL 16, matching the deployment
      # target. A service container would be a second, differently-configured
      # database that the tests do not actually use.
      # Measures only; see the note on the unit job.
      - name: Run integration tests
        run: >-
          uv run pytest -m integration -p no:randomly
          --cov=src --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.postgres
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-postgres
          path: .coverage.postgres
          include-hidden-files: true
          retention-days: 1

  kafka-integration:
    name: Kafka integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-groups --no-group airflow
      # A real broker, because the unit tests use a fake client and a fake
      # cannot demonstrate the one guarantee that matters: an uncommitted
      # offset really is redelivered.
      - name: Run Kafka integration tests
        run: >-
          uv run pytest -m kafka -p no:randomly
          --cov=src --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.kafka
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-kafka
          path: .coverage.kafka
          include-hidden-files: true
          retention-days: 1

  dag:
    name: Airflow DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      # Airflow is its own dependency group: the pipeline package does not need
      # it, and installing it everywhere would slow every other job for one.
      - run: uv sync --all-groups --group airflow
      # A DAG that fails to import is invisible — Airflow shows a parse error
      # and simply never schedules it. This is the cheapest way to know.
      - name: Parse and check the DAG
        run: uv run --group airflow pytest -m dag -p no:randomly
        env:
          AIRFLOW__CORE__UNIT_TEST_MODE: "True"
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  coverage:
    name: Combined coverage gate
    runs-on: ubuntu-latest
    needs: [unit, postgres-integration, kafka-integration]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Per job: four parallel jobs sharing one key race to reserve it and
          # the losers emit a save warning on every run.
          cache-suffix: ${{ github.job }}
      - run: uv sync --all-groups --no-group airflow
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      # Gating on the unit job alone would be satisfied by deleting
      # integration-heavy modules and failed by writing them.
      - name: Combine and enforce the gate
        run: |
          uv run coverage combine
          uv run coverage report --show-missing
          uv run coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

# Three jobs from TRD section 14 are not here yet because they would have
# nothing to run. A green job that asserts nothing is worse than an absent one.
# They arrive with the milestone that gives them content:
#
#   image              -> with a published image, not a locally built one
#
# The dag job is deliberately absent from `coverage.needs`: dags/ sits outside
# src/ and contributes nothing the gate measures, so making the gate wait on it
# would only slow the pipeline down. kafka-integration *is* in needs, because
# it covers src/pipeline/messaging/kafka.py and nothing else does.
#
# When kafka-integration lands it must upload .coverage.kafka and be added to
# this workflow's `coverage.needs`, or the gate will silently measure less than
# it claims.
