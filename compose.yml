# One command from a clean clone. No manual SQL, no credentials required.
#
# The two databases are separate on purpose. Airflow's metadata database is
# Airflow's business — it holds task instances, XCom and connections, and its
# schema is owned by whatever Airflow version is running. Putting the catalogue
# in there would couple a data migration to an Airflow upgrade and hand the
# scheduler write access to the thing it is supposed to be orchestrating.

name: book-data-pipeline

x-pipeline-env: &pipeline-env
  # Defaults to the local container so a clean clone runs with no credentials
  # at all. Override it to point the pipeline at the database the deployed API
  # actually serves — that one is the source of truth, and a pipeline writing
  # somewhere else is a pipeline nobody sees the output of.
  #
  #   PIPELINE_DATABASE_URL='postgresql+psycopg://…neon.tech/neondb' \
  #     docker compose --profile kafka up -d
  PIPELINE_DATABASE_URL: ${PIPELINE_DATABASE_URL:-postgresql+psycopg://catalogue:catalogue@catalogue-db:5432/catalogue}
  PIPELINE_OPENLIBRARY_CONTACT_EMAIL: ${PIPELINE_OPENLIBRARY_CONTACT_EMAIL:-you@example.com}
  PIPELINE_DISCOVERY_MANIFEST_PATH: /staging/candidates.jsonl
  PIPELINE_STAGING_DIR: /staging
  # A tiny captured sample so the stack is runnable the moment it starts. A
  # real run points this at a downloaded ol_dump_editions_*.txt.gz; see the
  # README. Shipping a default means "clone and trigger the DAG" works without
  # first waiting on a multi-gigabyte download.
  PIPELINE_OPENLIBRARY_DUMP_PATH: ${PIPELINE_OPENLIBRARY_DUMP_PATH:-/data/ol_dump_editions.txt.gz}
  # A slice by default. The published dump is ~12 GB and fetching all of it to
  # read the next few hundred lines would be absurd for a local stack; unset
  # this for a real deployment and the whole file is downloaded once.
  PIPELINE_DUMP_FETCH_MAX_LINES: ${PIPELINE_DUMP_FETCH_MAX_LINES:-50000}
  # Enrichment queries the documented APIs even for books already resolved.
  # Without it every book has one source, nothing can disagree, and the
  # contested_resolution DAG has nothing to adjudicate.
  PIPELINE_ENRICH_FROM_DOCUMENTED_SOURCES: ${PIPELINE_ENRICH_FROM_DOCUMENTED_SOURCES:-true}
  PIPELINE_DISCOVERY_MAX_CANDIDATES: ${PIPELINE_DISCOVERY_MAX_CANDIDATES:-500}
  # Absent by default. The adapter skips observably rather than failing, which
  # is what keeps a clean clone runnable with no credentials at all.
  PIPELINE_GOOGLEBOOKS_API_KEY: ${PIPELINE_GOOGLEBOOKS_API_KEY:-}
  # Both true in this stack, which is a deliberate acceptance rather than an
  # oversight: Goodreads is an unofficial contract used under accepted risk.
  # They gate the contested-resolution DAG, which asks it only about records
  # the documented sources disagree on — ingestion does not consult it at all
  # unless PIPELINE_GOODREADS_IN_RESOLUTION is also set.
  #
  # The library defaults stay false, so importing the package never enables it.
  PIPELINE_GOODREADS_ENABLED: ${PIPELINE_GOODREADS_ENABLED:-true}
  PIPELINE_GOODREADS_UNOFFICIAL_SOURCE_ACCEPTED: ${PIPELINE_GOODREADS_UNOFFICIAL_SOURCE_ACCEPTED:-true}
  PIPELINE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  PIPELINE_KAFKA_TOPIC_PARTITIONS: ${PIPELINE_KAFKA_TOPIC_PARTITIONS:-3}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-only}
    # Airflow 3 runs tasks against the Task Execution API rather than letting
    # them touch the metadata database directly. Workers default to localhost,
    # which is nothing inside the scheduler container — without this every task
    # fails with a bare "Connection refused" and no hint at the cause.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Every process must sign and verify with the same secret, or the worker's
    # token is rejected by the api-server and the task fails with "Invalid auth
    # token" — which says nothing about the two containers disagreeing.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-development-only}
    AIRFLOW__CORE__FERNET_KEY: ""
    # No login on a stack that only ever answers on loopback. The session
    # expiring every few hours while you are watching a run is friction with
    # nothing on the other side of it: there is no multi-user story here and no
    # secret in the UI that is not already in this file.
    #
    # This is only defensible together with the loopback bind on the apiserver
    # port below. Docker publishes to 0.0.0.0 by default, so without that line
    # this would hand an unauthenticated admin UI to everyone on the network.
    # To keep a login instead, drop this and set:
    #   AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    <<: *pipeline-env
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./tests/fixtures:/samples:ro
    # Writable: the pipeline fetches its own dump here. Not committed.
    - ./data:/data
    - airflow-logs:/opt/airflow/logs
    - staging:/staging
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
    staging-init:
      condition: service_completed_successfully

services:
  # --- databases ---------------------------------------------------------
  catalogue-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue
      POSTGRES_DB: catalogue
    volumes:
      # Mounted at the parent, not .../data: the postgres 18 image owns the
      # major-version subdirectory beneath it, and mounting .../data directly
      # makes it refuse to start against a volume an older image created.
      - catalogue-data:/var/lib/postgresql
    ports:
      - "${CATALOGUE_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- one-shot initialisation -------------------------------------------
  staging-init:
    image: busybox:1.37
    # The Airflow image runs as uid 50000 and the pipeline image as its own
    # system user; a named volume arrives root-owned, so neither can write to
    # it. They share this directory by design — Airflow writes the manifest and
    # the pipeline reads it — so it is opened up once here rather than giving
    # either container root.
    command: ["sh", "-c", "mkdir -p /staging && chmod 0777 /staging"]
    volumes:
      - staging:/staging
    restart: "no"

  catalogue-migrate:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    # Idempotent: alembic upgrade head is a no-op on an already-current
    # database, so restarting the stack costs nothing and needs no manual SQL.
    entrypoint: ["alembic", "upgrade", "head"]
    environment: *pipeline-env
    depends_on:
      catalogue-db:
        condition: service_healthy
      staging-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow version
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  # --- airflow -----------------------------------------------------------
  # Airflow 3 splits these into separate processes; with LocalExecutor the
  # api-server, scheduler and dag-processor are all required.
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # Loopback only, deliberately. This is what makes running the UI without
      # a login a local convenience rather than an open admin interface.
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-env
      # Airflow fixes the task graph when it parses the file, so the phase is
      # a parse-time decision. Set here and on the dag-processor only, and only
      # when the kafka profile supplies a broker to produce to.
      PIPELINE_KAFKA_ENABLED: ${PIPELINE_KAFKA_ENABLED:-false}
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      catalogue-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Nothing here defers, so this runs no triggers. It exists because Airflow's
  # health panel reports a triggerer that has never heartbeated as failed, and
  # a dashboard showing red for a component nobody is missing trains you to
  # ignore the panel that is meant to tell you something is wrong.
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    environment:
      <<: *airflow-env
      PIPELINE_KAFKA_ENABLED: ${PIPELINE_KAFKA_ENABLED:-false}
    restart: unless-stopped

  # --- phase 2: kafka ----------------------------------------------------
  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Never left to auto-creation. An auto-created topic gets
      # num.partitions=1, so the barrier's write to partition 1 or 2 fails and
      # a consumer waiting on a three-partition boundary waits forever.
      # Disabling it turns that silent stall into a startup error.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-topics:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    # Idempotent: --if-not-exists means restarting the stack is free. Every
    # producer and consumer waits on this completing.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        for topic in books.raw books.clean; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions ${PIPELINE_KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1
        done
        # One partition: the DLQ is drained by a human, not scaled.
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic books.dlq \
          --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  transform-consumer:
    profiles: [kafka]
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: ["transform-consumer"]
    environment: *pipeline-env
    volumes:
      - staging:/staging
    depends_on:
      catalogue-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    # Long-running by design: the DAG schedules extraction and finishes, and
    # these carry the run from there.
    restart: unless-stopped

  load-consumer:
    profiles: [kafka]
    # One per partition of books.clean. Declared here rather than passed as
    # --scale, because --scale is not remembered: every rebuild silently
    # dropped back to a single consumer, and the only symptom was throughput
    # falling to a third with nothing anywhere saying why.
    deploy:
      replicas: ${LOAD_CONSUMERS:-3}
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    command: ["load-consumer"]
    environment: *pipeline-env
    volumes:
      - staging:/staging
    depends_on:
      catalogue-migrate:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- observability -----------------------------------------------------
  # Its own profile: three more containers is a real cost for a stack that
  # already runs thirteen, and the pipeline does not need them to work. Bring
  # them up when you want to watch something.
  #
  #   docker compose --profile observability up -d
  #   http://127.0.0.1:3000
  #
  # This exists because a hosted page cannot: consumer lag and Airflow state
  # are only reachable from inside this network, and the catalogue API sends no
  # CORS header. Grafana runs where the data is.
  grafana:
    profiles: [observability]
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # No sign-in for a dashboard bound to loopback, for the same reason
      # Airflow has none here: a login that protects nothing is friction.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      CATALOGUE_PG_HOST: ${CATALOGUE_PG_HOST:-catalogue-db:5432}
      CATALOGUE_PG_DB: ${CATALOGUE_PG_DB:-catalogue}
      CATALOGUE_PG_USER: ${CATALOGUE_PG_USER:-catalogue}
      CATALOGUE_PG_PASSWORD: ${CATALOGUE_PG_PASSWORD:-catalogue}
    ports:
      # Loopback only. The datasource credentials are inside this container.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this is a local development stack, not a time-series
      # archive, and the interesting question is always "right now".
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  # The one thing here with no database behind it. Kafka publishes consumer
  # lag over JMX only, so it takes an exporter to become a number anything
  # else can read.
  kafka-exporter:
    profiles: [observability]
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    # No depends_on: the broker lives in a different profile, and a hard
    # dependency across profiles makes the whole project invalid when only one
    # of them is selected. The exporter retries until Kafka answers.
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  catalogue-data:
  airflow-data:
  airflow-logs:
  staging:
