[project]
name = "book-data-pipeline"
version = "0.1.0"
description = "Airflow- and Kafka-orchestrated ETL pipeline building a canonical book catalogue from public APIs"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Ibraheem Muhammadawwal" }]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<26",
    "pycountry>=24.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Phase 2 only. Declared so the dependency is explicit without forcing the
# C client into every environment that only needs the v0.1 core ETL.
kafka = ["confluent-kafka>=2.6,<3"]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.112,<7",
    "respx>=0.21,<0.23",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.15",
    "testcontainers[postgres,kafka]>=4.8,<5",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

# ---------------------------------------------------------------------------
# Quality gates
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes
    "T20",       # no print
    "PT",        # pytest style
    "RET",       # return simplification
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions and magic values are the point of a test suite.
"tests/**" = ["PLR2004", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No bundled type information upstream.
module = ["pycountry.*", "confluent_kafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires real services via testcontainers (deselect with -m 'not integration')",
    "dag: requires an Airflow installation",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
