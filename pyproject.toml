[project]
name = "book-data-pipeline"
version = "0.1.0"
description = "Airflow- and Kafka-orchestrated ETL pipeline building a canonical book catalogue from public APIs"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Ibraheem Muhammadawwal" }]

dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<0.29",
    "tenacity>=9.0,<10",
    "structlog>=24.4,<26",
    "pycountry>=24.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
# Phase 2 only. Declared so the dependency is explicit without forcing the
# C client into every environment that only needs the v0.1 core ETL.
kafka = ["confluent-kafka>=2.6,<3"]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.112,<7",
    "respx>=0.21,<0.23",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.15",
    "testcontainers[postgres,kafka]>=4.8,<5",
    "pre-commit>=4.0,<5",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

# ---------------------------------------------------------------------------
# Quality gates
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes
    "T20",       # no print
    "PT",        # pytest style
    "RET",       # return simplification
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Assertions and magic values are the point of a test suite.
"tests/**" = ["PLR2004", "ARG001"]
# Alembic writes these. Reformatting generated DDL by hand invites a typo in
# the one file whose correctness cannot be checked by reading the diff.
# Alembic writes these from a template we do not control.
"migrations/versions/*" = ["E501", "UP035", "UP007", "I001"]
# These modules exist to fold ambiguous Unicode punctuation into its plain
# equivalents, so the "ambiguous character" they are flagged for is the input
# they are written to handle. Silencing it here rather than project-wide keeps
# the check live everywhere it could still catch a real typo.
"src/pipeline/transform/normalise.py" = ["RUF001"]
"src/pipeline/transform/isbn.py" = ["RUF001"]
"tests/unit/transform/test_normalise.py" = ["RUF001"]
"tests/unit/transform/test_series.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No bundled type information upstream.
module = ["pycountry.*", "confluent_kafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
# Extractors are async all the way down; opting in per test buys nothing.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires real services via testcontainers (deselect with -m 'not integration')",
    "dag: requires an Airflow installation",
]

[tool.coverage.run]
source = ["src"]
branch = true
# Every CI test job measures without gating and uploads its data file; one
# final job combines them and enforces the threshold. The load and consumer
# modules are exercised almost entirely by container-backed tests, so a
# unit-only gate would put them in the denominator and none of them in the
# numerator.
#
# parallel      — unique suffix per data file, so uploads do not collide.
# relative_files — a job inside a container records /app/src/... while the
#                 runner records /home/runner/work/...; without this, combine
#                 treats them as different files and total coverage falls as
#                 jobs are added.
parallel = true
relative_files = true

[tool.coverage.paths]
source = ["src", "*/src", "/app/src"]

[tool.coverage.report]
# Applies to `coverage report` and to any single pytest --cov run. CI's per-job
# runs pass --cov-fail-under=0 to opt out, because a job that exercises only
# part of the code cannot fairly judge the whole; the combining job enforces
# this number once.
#
# 98, not 100. The handful of uncovered lines are defence in depth against
# things a test cannot stage honestly: a concurrent insert winning a race, a
# pycountry behaviour change, and second-layer guards that the transform stage
# already prevents from being reached. Writing tests that fake those would
# assert the mock, not the code.
fail_under = 98
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
